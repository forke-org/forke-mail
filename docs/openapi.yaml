openapi: 3.1.0
info:
  title: Forke Mail Developer API
  version: 1.1.0
  description: Shared developer platform and real transactional engine. Both send APIs share acceptance, quota, idempotency and dispatch. See developer-quickstart.md for signatures, migrations and failure policy. Local log-driver delivery is simulated.
servers:
  - url: http://localhost:8080
security:
  - BearerKey: []
  - DashboardSession: []
paths:
  /api/keys:
    get:
      operationId: listKeys
      security: [{DashboardSession: []}]
      responses:
        '200': {description: Key metadata without raw keys or hashes}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createKey
      security: [{DashboardSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope, password]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                scope: {type: string, enum: [sending_access, full_access]}
                password: {type: string, writeOnly: true}
      responses:
        '201': {description: Metadata plus one-time key; Cache-Control no-store}
        default: {$ref: '#/components/responses/Error'}
  /api/keys/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeKey
      security: [{DashboardSession: []}]
      responses:
        '204': {description: Revoked; subsequent authentication fails}
        default: {$ref: '#/components/responses/Error'}
  /api/keys/{id}/rotate:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: rotateKey
      security: [{DashboardSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, writeOnly: true}
      responses:
        '201': {description: One-time replacement key; old key immediately revoked}
        default: {$ref: '#/components/responses/Error'}
  /api/domains:
    get:
      operationId: listDomains
      description: Requires dashboard session or full_access key.
      responses:
        '200': {description: Workspace sending identities}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDomain
      description: Requires dashboard session or full_access key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
                kind: {type: string, enum: [domain, email], default: domain}
      responses:
        '201': {description: Identity and DNS guidance; SES verifies actual sending eligibility}
        default: {$ref: '#/components/responses/Error'}
  /api/domains/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: deleteDomain
      responses:
        '204': {description: Removed identity}
        default: {$ref: '#/components/responses/Error'}
  /api/domains/{id}/verify:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: verifyDomain
      responses:
        '200': {description: Refreshed provider identity status; log driver uses a fake provider}
        default: {$ref: '#/components/responses/Error'}
  /api/domains/{id}/dns:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: mail_from
        in: query
        schema: {type: string}
        description: Optional subdomain; DNS preview only, does not configure SES.
    get:
      operationId: inspectDomainDNS
      responses:
        '200':
          description: Expected and observed DKIM, DMARC and optional custom MAIL FROM SPF/MX records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mail_from_mode: {type: string, enum: [ses_default, custom_dns_preview]}
                  ses_configuration_required: {type: boolean}
                  checked_at: {type: string, format: date-time}
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        type: {type: string, enum: [CNAME, TXT, MX]}
                        name: {type: string}
                        value: {type: string}
                        status: {type: string, enum: [found, pending, mismatch]}
                        observed: {type: array, items: {type: string}}
                        reason: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/webhooks:
    get:
      operationId: listWebhooks
      description: Dashboard session or full_access only. No signing secrets returned.
      responses:
        '200': {description: Workspace webhook metadata}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createWebhook
      description: Public HTTPS on port 443 only; maximum ten endpoints per workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreate'}
      responses:
        '201': {description: Endpoint metadata plus one-time secret; Cache-Control no-store}
        default: {$ref: '#/components/responses/Error'}
  /api/webhooks/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                url: {type: string, format: uri}
                events: {$ref: '#/components/schemas/Events'}
                enabled: {type: boolean}
      responses:
        '200': {description: Updated safe metadata; disabling cancels outstanding jobs}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteWebhook
      responses:
        '204': {description: Endpoint and its delivery history removed}
        default: {$ref: '#/components/responses/Error'}
  /api/webhooks/{id}/rotate:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: rotateWebhookSecret
      responses:
        '201': {description: New one-time secret and incremented secret_version; brief overlap for in-flight attempts}
        default: {$ref: '#/components/responses/Error'}
  /api/webhooks/{id}/deliveries:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    get:
      operationId: listWebhookDeliveries
      responses:
        '200': {description: Delivery IDs, event IDs, status, attempts, next attempt, response code and timestamps; no receiver response bodies}
        default: {$ref: '#/components/responses/Error'}
  /api/emails:
    post:
      operationId: enqueueTransactionalEmail
      description: Compatibility adapter over the canonical transactional service. Required key up to 128 characters. One real message ID and quota reservation across both send APIs. Legacy stub keys conflict. Sending keys allowed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, subject]
              anyOf: [{required: [html]}, {required: [text]}]
              properties:
                from: {type: string, format: email}
                to: {type: string, format: email}
                subject: {type: string, minLength: 1, maxLength: 256}
                html: {type: string, minLength: 1}
                text: {type: string, minLength: 1}
      responses:
        '202':
          description: Stable message ID; repeats within 24 hours carry Idempotency-Replayed true.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, mode]
                properties:
                  id: {type: string, format: uuid}
                  status: {const: queued}
                  mode: {const: engine}
        default: {$ref: '#/components/responses/Error'}
  /api/transactional:
    post:
      operationId: sendTransactional
      description: Native canonical enqueue. Session, full_access or sending_access. Keyless matching content deduplicates for 60 seconds; keyed requests for 24 hours. Different payload with same key returns idempotency_key_reused. Legacy stub keys return legacy_stub_key_requires_new_key. Tracking requires HTML.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[!-~]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionalRequest'}
      responses:
        '202':
          description: New durable message; status may advance before the response is loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionalMessage'}
        '200':
          description: Replay of the same ID. Idempotent-Replayed header true; replayed is idempotency_key or duplicate_content.
          headers:
            Idempotent-Replayed: {schema: {const: 'true'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionalMessage'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listTransactional
      description: Workspace-scoped list. Session or full_access required.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [queued, sending, sent, failed]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Message metadata only, no raw body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: {type: array, items: {$ref: '#/components/schemas/TransactionalMessage'}}
        default: {$ref: '#/components/responses/Error'}
  /api/transactional/stats:
    get:
      operationId: transactionalStats
      description: Workspace-only 24-hour counts and dispatch latency percentiles. Session or full_access required.
      responses:
        '200': {description: Totals, queued, sending, sent, failed, delivered, bounced, complained, opened, clicked, tracking totals and dispatch p50/p95/p99/max milliseconds}
        default: {$ref: '#/components/responses/Error'}
  /api/transactional/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getTransactional
      description: Session, full_access or sending_access. Foreign IDs return 404. Includes html/text and timeline events.
      responses:
        '200':
          description: Message detail and timeline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionalMessage'}
        default: {$ref: '#/components/responses/Error'}
  /t/o/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    get:
      operationId: trackOpen
      security: []
      description: HMAC-signed transactional pixel. Invalid tokens and known automated agents create no event. First eligible open creates email.opened; all eligible loads increment count.
      responses:
        '200': {description: Non-cacheable transparent GIF, including for invalid tokens}
  /t/c/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    get:
      operationId: trackClick
      security: []
      description: HMAC-signed transactional click. Eligible sent/tracked messages create email.clicked. Known automated agents are excluded.
      responses:
        '302': {description: Redirect to signed HTTP/HTTPS target}
        '404': {description: Invalid token, no event}
components:
  securitySchemes:
    BearerKey: {type: http, scheme: bearer, bearerFormat: fm_live_ API key}
    DashboardSession: {type: apiKey, in: cookie, name: fm_session}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error:
      description: JSON error. See quickstart for 400/401/402/403/404/409/413/422/429/500/502/503 conditions.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    TransactionalRequest:
      type: object
      additionalProperties: false
      required: [to, from_address, subject]
      anyOf: [{required: [html]}, {required: [text]}]
      properties:
        to: {type: string, format: email}
        from_address: {type: string, format: email}
        from_name: {type: string, maxLength: 100}
        reply_to: {type: string, format: email}
        subject: {type: string, minLength: 1, maxLength: 300}
        html: {type: string, description: At most 256 KiB UTF-8}
        text: {type: string, description: At most 256 KiB UTF-8}
        track_opens: {type: boolean, default: false}
        track_clicks: {type: boolean, default: false}
        tags:
          type: object
          maxProperties: 10
          propertyNames: {pattern: '^[A-Za-z0-9_-]+$', maxLength: 64}
          additionalProperties: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 64}
    TransactionalMessage:
      type: object
      required: [id, status, to, from_address, subject]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, sending, sent, failed]}
        to: {type: string, format: email}
        from_address: {type: string, format: email}
        subject: {type: string}
        replayed: {type: string, enum: [idempotency_key, duplicate_content]}
        attempts: {type: integer}
        created_at: {type: string, format: date-time}
        dispatch_ms: {type: [number, 'null']}
        track_opens: {type: boolean}
        track_clicks: {type: boolean}
        open_count: {type: integer}
        click_count: {type: integer}
    CustomerWebhookEvent:
      type: object
      description: Migration 10 extends new payloads only. Historical pending deliveries can omit message_id/message_type. Headers and immutable payload bytes are signed as documented in quickstart.
      properties:
        id: {type: string, description: Stable event bigint serialized as string; Webhook-Id header is delivery UUID}
        version: {const: '1'}
        type: {type: string}
        created_at: {type: string, format: date-time}
        data:
          type: object
          properties:
            message_id: {type: [string, 'null'], format: uuid}
            message_type: {type: string, enum: [transactional, broadcast, workspace]}
            email_id: {type: [string, 'null'], format: uuid}
            recipient_id: {type: [string, 'null'], format: uuid}
    WebhookCreate:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        events: {$ref: '#/components/schemas/Events'}
    Events:
      type: array
      minItems: 1
      maxItems: 13
      uniqueItems: true
      items:
        type: string
        enum: [email.queued, email.sent, email.delivered, email.bounced, email.soft_bounced, email.complained, email.unsubscribed, email.failed, email.rejected, email.delayed, email.opened, email.clicked, workspace.sending_paused]
