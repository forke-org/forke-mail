server {
    listen 80;
    server_name mail.forke.space;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.forke.space;
    ssl_certificate /etc/letsencrypt/live/forke.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forke.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location ~* ^/(\.env|\.git|\.ssh|id_rsa|solr|Jenkinsfile|owa|wp-|phpmyadmin|\.kube|\.aws|actuator|boaform|autodiscover) {
        return 404;
    }

    location / {
        limit_req zone=general_rate burst=50 nodelay;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
