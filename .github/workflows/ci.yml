name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forkemail
          POSTGRES_PASSWORD: forkemail
          POSTGRES_DB: forkemail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forkemail"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://forkemail:forkemail@localhost:5432/forkemail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal migrations frontend)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -p 1 ./...
