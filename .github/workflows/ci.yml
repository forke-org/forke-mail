name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forkemail
          POSTGRES_PASSWORD: forkemail
          POSTGRES_DB: forkemail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forkemail"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://forkemail:forkemail@localhost:5432/forkemail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal migrations frontend)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -p 1 ./...

  deploy:
    name: Deploy to Oracle Cloud
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: forke-mail-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the ARM64 release
        run: |
          mkdir -p release
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o release/forke-mail-linux-arm64 ./cmd/server
          cp deploy/forke-mail.service deploy/install.sh release/
      - name: Copy the release to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: release/*
          target: /tmp
          strip_components: 1
      - name: Install and restart Forke Mail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            bash /tmp/install.sh
            rm -f /tmp/install.sh
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/healthz)" = "200"
